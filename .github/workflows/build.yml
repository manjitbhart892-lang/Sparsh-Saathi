name: MB Player Permanent Builder

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Capacitor & Setup App
        run: |
          mkdir -p app-build/www

          # मुख्य index.html को कॉपी करेगा
          if [ -f "index.html" ]; then
            cp index.html app-build/www/index.html
          elif [ -f "www/index.html" ]; then
            cp www/index.html app-build/www/index.html
          else
            echo "<h1>MB Player Ready</h1>" > app-build/www/index.html
          fi

          cd app-build
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.manjeet.mbplayer",
            "appName": "MB Player",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android

          # होमस्क्रीन के लिए लोगो (Cyan + Deep Blue Play Arrow)
          python3 -c "
          from PIL import Image, ImageDraw
          import os

          img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          draw.rounded_rectangle([16, 16, 496, 496], radius=115, fill=(15, 23, 42, 255), outline=(0, 229, 255, 255), width=10)
          draw.rounded_rectangle([36, 36, 476, 476], radius=95, fill=(16, 32, 60, 255))
          draw.polygon([(190, 140), (190, 372), (385, 256)], fill=(255, 255, 255, 255))
          draw.ellipse([355, 245, 380, 270], fill=(0, 229, 255, 255))

          res_dir = 'android/app/src/main/res'
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for folder, s in sizes.items():
              p = os.path.join(res_dir, folder)
              os.makedirs(p, exist_ok=True)
              resized = img.resize((s, s), Image.Resampling.LANCZOS)
              resized.save(os.path.join(p, 'ic_launcher.png'))
              resized.save(os.path.join(p, 'ic_launcher_round.png'))
              resized.save(os.path.join(p, 'ic_launcher_foreground.png'))
          "

          # ऑटो-रोटेट और स्टोरेज/मीडिया परमिशन जोड़ें
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensor"/g' android/app/src/main/AndroidManifest.xml || true
          sed -i '/<application/i \
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\
              <uses-permission android:name="android.permission.WAKE_LOCK" />' android/app/src/main/AndroidManifest.xml

          npx cap sync android

      - name: Build Debug APK
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK to MB-Player.apk
        run: |
          mkdir -p release-apk
          cp app-build/android/app/build/outputs/apk/debug/app-debug.apk release-apk/MB-Player.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MB-Player-APK
          path: release-apk/MB-Player.apk

      - name: Direct APK Release (No Zip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes || true
          git tag -d v1.0 || true
          gh release create v1.0 release-apk/MB-Player.apk \
            --title "MB Player Official APK" \
            --notes "सीधा MB-Player.apk डाउनलोड करें।"
            
