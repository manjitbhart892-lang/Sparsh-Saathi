name: Build Sparsh Saathi APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Initialize Web-to-APK Project
        run: |
          mkdir -p app-build/www
          cp index.html app-build/www/index.html
          cp index.css app-build/www/index.css
          cd app-build
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sparshsaathi.app",
            "appName": "स्पर्श साथी",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android
          npx cap sync android
          npx cap copy android

          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">स्पर्श साथी</string>|g' android/app/src/main/res/values/strings.xml
          sed -i 's|<string name="title_activity_main">.*</string>|<string name="title_activity_main">स्पर्श साथी</string>|g' android/app/src/main/res/values/strings.xml

      - name: Build Debug APK
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Sparsh-Saathi.apk

      - name: Upload Working APK
        uses: actions/upload-artifact@v4
        with:
          name: Sparsh-Saathi-App
          path: app-build/android/app/build/outputs/apk/debug/Sparsh-Saathi.apk
          
