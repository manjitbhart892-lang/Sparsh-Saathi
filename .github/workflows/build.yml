name: Build Sparsh Saathi APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Python & Pillow
        run: |
          python3 -m pip install --upgrade pip pillow

      - name: Prepare Web and Capacitor Project
        run: |
          mkdir -p app-build/www
          
          # मुख्य फ़ोल्डर की वेब फ़ाइलें कॉपी करें
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'app-build' -exec cp -r {} app-build/www/ \;
          
          if [ ! -f app-build/www/index.html ]; then
            echo '<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>स्पर्श साथी</title><style>body{margin:0;background:#0d0d0d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;}h1{color:#ff3333;text-shadow:0 0 10px #ff0000;}</style></head><body><h1>स्पर्श साथी</h1></body></html>' > app-build/www/index.html
          fi

          cd app-build
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sparshsaathi.official",
            "appName": "स्पर्श साथी",
            "webDir": "www",
            "server": {
              "cleartext": true
            }
          }
          EOF
          
          npx cap add android
          npx cap sync android

          # ऐप का नाम हिंदी में "स्पर्श साथी" सेट करें
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">स्पर्श साथी</string>
              <string name="title_activity_main">स्पर्श साथी</string>
              <string name="package_name">com.sparshsaathi.official</string>
              <string name="custom_url_scheme">com.sparshsaathi.official</string>
          </resources>
          EOF

          mkdir -p android/app/src/main/res/values-hi
          cat << 'EOF' > android/app/src/main/res/values-hi/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">स्पर्श साथी</string>
              <string name="title_activity_main">स्पर्श साथी</string>
          </resources>
          EOF

      - name: Apply Custom App Logo
        run: |
          python3 - << 'EOF'
          import os, glob, shutil
          from PIL import Image

          candidates = ['logo.png', 'logo.jpg', 'logo.jpeg', 'icon.png', 'icon.jpg', 'icon.jpeg']
          target = None
          for c in candidates:
              if os.path.exists(c):
                  target = c
                  break

          if not target:
              all_imgs = [f for f in glob.glob("*.*") if f.lower().endswith(('.png', '.jpg', '.jpeg', '.webp'))]
              if all_imgs:
                  target = all_imgs[0]

          if target:
              print(f"==> Applying app logo: {target}")
              img = Image.open(target).convert("RGBA")
              res_dir = "app-build/android/app/src/main/res"
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192
              }
              for folder, size in sizes.items():
                  folder_path = os.path.join(res_dir, folder)
                  os.makedirs(folder_path, exist_ok=True)
                  resized = img.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(folder_path, "ic_launcher.png"), "PNG")
                  resized.save(os.path.join(folder_path, "ic_launcher_round.png"), "PNG")
                  resized.save(os.path.join(folder_path, "ic_launcher_foreground.png"), "PNG")
              
              anydpi_path = os.path.join(res_dir, "mipmap-anydpi-v26")
              if os.path.exists(anydpi_path):
                  shutil.rmtree(anydpi_path)
              print("==> Logo applied successfully!")
          else:
              print("==> No logo uploaded yet. Default icon used.")
          EOF

      - name: Configure Keystore and Build Signed Release APK
        run: |
          cd app-build/android
          echo "android.injected.testOnly=false" >> gradle.properties
          
          # डिजिटल सिग्नेचर कीस्टोर
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias sparsh -storepass sparsh123 -keypass sparsh123 -dname "CN=SparshSaathi, OU=App, O=Sparsh, L=Delhi, S=Delhi, C=IN"
          
          python3 - << 'EOF'
          import re
          with open("app/build.gradle", "r") as f:
              data = f.read()

          signing = """
              signingConfigs {
                  release {
                      storeFile file('release-key.jks')
                      storePassword 'sparsh123'
                      keyAlias 'sparsh'
                      keyPassword 'sparsh123'
                  }
              }
          """
          if "signingConfigs {" not in data:
              data = re.sub(r'(\n\s*buildTypes\s*\{)', signing + r'\1', data, count=1)
          if "signingConfig signingConfigs.release" not in data:
              data = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', data, count=1)

          with open("app/build.gradle", "w") as f:
              f.write(data)
          EOF

          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p release-apk
          cp app-build/android/app/build/outputs/apk/release/app-release.apk release-apk/Sparsh-Saathi.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sparsh-Saathi-APK
          path: release-apk/Sparsh-Saathi.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: build-${{ github.run_number }}
          name: स्पर्श साथी APK (Build ${{ github.run_number }})
          files: release-apk/Sparsh-Saathi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
