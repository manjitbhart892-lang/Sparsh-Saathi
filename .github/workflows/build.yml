name: Build Sparsh Saathi APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Web-to-APK Project
        run: |
          mkdir app-build && cd app-build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sparsh Saathi" "com.sparsh.saathi" --web-dir ../
          npx cap add android
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sparsh.saathi",
            "appName": "Sparsh Saathi",
            "webDir": "../",
            "server": {
              "url": "https://sparsh-saathi.ai.studio",
              "cleartext": true
            }
          }
          EOF
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sparsh-Saathi-APK
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk
          
