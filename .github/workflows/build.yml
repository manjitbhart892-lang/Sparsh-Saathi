name: Build Sparsh Saathi APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Tools & Hindi Font
        run: |
          pip install pillow --break-system-packages
          curl -fsSL "https://github.com/notofonts/notofonts.github.io/raw/main/fonts/NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Bold.ttf" -o /tmp/hindi.ttf || true

      - name: Build Web App
        run: |
          mkdir -p app-build/www
          cat << 'EOF' > app-build/www/index.html
          <!DOCTYPE html>
          <html lang="hi">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
          <title>स्पर्श साथी</title>
          <style>
          *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
          :root{--bg:#f4f6fa;--card:#fff;--txt:#1a1a1a;--pri:#1a73e8;--red:#d93025;--grn:#1e8e3e;}
          body.high-contrast{--bg:#000;--card:#121212;--txt:#ff0;--pri:#ff0;}
          body{background:var(--bg);color:var(--txt);padding:14px 14px 80px;}
          header{text-align:center;padding:16px;background:var(--card);border-radius:20px;position:relative;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
          .menu-btn{position:absolute;top:14px;right:14px;background:rgba(26,115,232,0.1);color:var(--pri);border:1px solid var(--pri);padding:6px 12px;border-radius:10px;font-weight:bold;}
          .logo{display:inline-flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:50%;background:#fff;border:4px solid #1a73e8;color:#0d47a1;font-size:32px;font-weight:900;}
          .sec{font-size:16px;font-weight:bold;margin:16px 0 10px 4px;}
          .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
          .card{background:var(--card);padding:14px 8px;border-radius:16px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.05);cursor:pointer;}
          .c-full{grid-column:span 2;}
          .prayer{background:var(--card);border-left:5px solid var(--pri);text-align:left;padding:12px;}
          #profModal,#torchBox{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;text-align:center;padding:20px;}
          #profModal{background:rgba(0,0,0,0.7);}
          #torchBox{background:#fff!important;color:#000!important;padding-top:50%;}
          .p-box{background:var(--card);color:var(--txt);border-radius:20px;padding:20px;margin-top:15%;border:2px solid var(--pri);}
          .a-btn{display:block;width:100%;padding:12px;border-radius:10px;margin-top:10px;color:#fff;text-decoration:none;font-weight:bold;}
          .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--card);padding:12px;border-radius:16px;}
          .cb{padding:14px 0;font-size:18px;font-weight:bold;border-radius:8px;border:1px solid #ddd;background:var(--card);color:var(--txt);}
          </style>
          </head>
          <body>
          <header>
          <button class="menu-btn" onclick="openProfile()">⋮ प्रोफ़ाइल</button>
          <div class="logo">स</div>
          <h1 style="font-size:22px;margin-top:6px;">स्पर्श साथी</h1>
          <p style="font-size:12px;opacity:0.85;">स्पर्श राजकीय दृष्टिबाधित इंटर कॉलेज, गोरखपुर</p>
          <div id="st" style="margin-top:6px;font-size:13px;font-weight:bold;color:var(--pri);">तैयार है</div>
          <button onclick="stopAll()" style="width:100%;background:var(--red);color:#fff;border:none;padding:10px;border-radius:10px;margin-top:10px;font-weight:bold;">■ आवाज़ बंद करें</button>
          </header>

          <div id="profModal">
          <div class="p-box">
          <div style="width:60px;height:60px;border-radius:50%;background:#1a73e8;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;margin-bottom:8px;">मं</div>
          <h2>मंजीत भारती</h2>
          <p style="color:var(--pri);font-weight:bold;">ऐप निर्माता एवं डेवलपर</p>
          <p style="font-size:12px;margin:6px 0;">स्पर्श राजकीय दृष्टिबाधित इंटर कॉलेज, गोरखपुर</p>
          <a href="tel:919876543210" class="a-btn" style="background:var(--grn);">📞 कॉल करें</a>
          <a href="mailto:manjitbharti892@gmail.com" class="a-btn" style="background:var(--pri);">✉️ ईमेल भेजें</a>
          <button onclick="closeProfile()" class="a-btn" style="background:var(--red);border:none;">बंद करें</button>
          </div>
          </div>

          <div class="sec">🛠️ सुगम टूल्स एवं टॉर्च</div>
          <div class="grid">
          <div class="card" onclick="toggleFlash()"><div style="font-size:30px;">🔦</div><b>टॉर्च लाइट</b></div>
          <div class="card" style="background:var(--red);color:#fff;" onclick="callSOS()"><div style="font-size:30px;">🚨</div><b>112 इमरजेंसी</b></div>
          <div class="card" onclick="speakTime()"><div style="font-size:30px;">⏰</div><b>समय व तारीख</b></div>
          <div class="card" onclick="speakBatt()"><div style="font-size:30px;">🔋</div><b>बैटरी स्थिति</b></div>
          <div class="card" onclick="testVib()"><div style="font-size:30px;">📳</div><b>स्पर्श कंपन</b></div>
          <div class="card" onclick="toggleCont()"><div style="font-size:30px;">👁️</div><b>कंट्रास्ट मोड</b></div>
          </div>

          <div class="sec">🙏 प्रार्थना एवं राष्ट्रगान</div>
          <div class="grid">
          <div class="card c-full prayer" onclick="playP1()"><b>📖 प्रार्थना 1: इतनी शक्ति हमें देना दाता</b></div>
          <div class="card c-full prayer" onclick="playP2()"><b>📖 प्रार्थना 2: वह शक्ति हमें दो दयानिधे</b></div>
          <div class="card prayer" onclick="playAnthem()"><b>🇮🇳 राष्ट्रगान</b></div>
          <div class="card prayer" onclick="playSong()"><b>🌸 राष्ट्रगीत</b></div>
          </div>

          <div class="sec">🔢 बोलने वाला कैलकुलेटर</div>
          <div id="cDisp" style="background:rgba(0,0,0,0.05);padding:12px;border-radius:10px;text-align:right;font-size:24px;font-weight:bold;margin-bottom:8px;">0</div>
          <div class="calc-grid">
          <button class="cb" onclick="cIn('C')">C</button><button class="cb" onclick="cIn('/')">÷</button><button class="cb" onclick="cIn('*')">×</button><button class="cb" onclick="cIn('-')">-</button>
          <button class="cb" onclick="cIn('7')">7</button><button class="cb" onclick="cIn('8')">8</button><button class="cb" onclick="cIn('9')">9</button><button class="cb" onclick="cIn('+')">+</button>
          <button class="cb" onclick="cIn('4')">4</button><button class="cb" onclick="cIn('5')">5</button><button class="cb" onclick="cIn('6')">6</button><button class="cb" onclick="cEq()" style="grid-row:span 2;padding:26px 0;background:var(--grn);color:#fff;">=</button>
          <button class="cb" onclick="cIn('1')">1</button><button class="cb" onclick="cIn('2')">2</button><button class="cb" onclick="cIn('3')">3</button>
          <button class="cb" onclick="cIn('0')" style="grid-column:span 2;">0</button><button class="cb" onclick="cIn('.')">.</button>
          </div>

          <div id="torchBox">
          <div style="font-size:30px;font-weight:bold;margin-bottom:20px;">🔦 टॉर्च चालू है</div>
          <button onclick="toggleFlash()" class="a-btn" style="background:var(--red);border:none;width:80%;margin:auto;">टॉर्च बंद करें</button>
          </div>

          <script>
          function sp(t){
          if('vibrate' in navigator)try{navigator.vibrate(40);}catch(e){}
          document.getElementById('st').innerText=t;
          if('speechSynthesis' in window){
          try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';window.speechSynthesis.speak(u);}catch(e){}
          }
          }
          function stopAll(){if('speechSynthesis' in window)window.speechSynthesis.cancel();if(isT)toggleFlash();sp("आवाज़ बंद की गई");}
          function openProfile(){document.getElementById('profModal').style.display='block';sp("मंजीत भारती प्रोफ़ाइल");}
          function closeProfile(){document.getElementById('profModal').style.display='none';}
          function callSOS(){sp("इमरजेंसी 112 पर कॉल किया जा रहा है");setTimeout(()=>{window.location.href="tel:112";},1000);}
          let tStream=null,isT=false;
          async function toggleFlash(){
          const b=document.getElementById('torchBox');
          if(!isT){isT=true;b.style.display='block';sp("टॉर्च चालू है");try{tStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const tr=tStream.getVideoTracks()[0];if(tr.getCapabilities&&tr.getCapabilities().torch)await tr.applyConstraints({advanced:[{torch:true}]});}catch(e){}}
          else{isT=false;b.style.display='none';if(tStream){tStream.getTracks().forEach(t=>t.stop());tStream=null;}sp("टॉर्च बंद की गई");}
          }
          function speakTime(){const n=new Date();const t=n.toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'});sp("समय है "+t);}
          function speakBatt(){if('getBattery' in navigator){navigator.getBattery().then(b=>{sp("बैटरी "+Math.round(b.level*100)+" प्रतिशत है");});}else sp("बैटरी जानकारी उपलब्ध नहीं");}
          function testVib(){if('vibrate' in navigator){navigator.vibrate([120,60,180]);sp("कंपन सक्रिय है");}else sp("कंपन सपोर्ट नहीं है");}
          function toggleCont(){document.body.classList.toggle('high-contrast');sp("कंट्रास्ट मोड बदला गया");}
          function playP1(){sp("इतनी शक्ति हमें देना दाता, मन का विश्वास कमजोर होना। हम चलें नेक रस्ते पे हमसे, भूलकर भी कोई भूल होना।");}
          function playP2(){sp("वह शक्ति हमें दो दयानिधे, कर्तव्य मार्ग पर डट जावें। पर सेवा पर उपकार में हम, निज जीवन सफल बना जावें।");}
          function playAnthem(){sp("जन गण मन अधिनायक जय हे, भारत भाग्य विधाता। जय हे, जय हे, जय हे, जय जय जय जय हे!");}
          function playSong(){sp("वन्दे मातरम्! सुजलाम् सुफलाम् मलयजशीतलाम् शस्यश्यामलाम् मातरम्!");}
          let cVal='0';
          function cIn(c){if(c==='C'){cVal='0';sp("क्लियर");}else{cVal=(cVal==='0'&&c!=='.')?c:cVal+c;sp(c);}document.getElementById('cDisp').innerText=cVal;}
          function cEq(){try{const r=eval(cVal);sp("बराबर है "+r);cVal=String(r);}catch(e){sp("गलत");cVal='0';}document.getElementById('cDisp').innerText=cVal;}
          window.onload=function(){sp("स्पर्श साथी तैयार है");};
          </script>
          </body>
          </html>
          EOF

      - name: Build Android APK
        run: |
          cd app-build
          npm init -y
          npm i @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat << 'EOF' > capacitor.config.json
          {"appId":"com.sparshsaathi.app","appName":"स्पर्श साथी","webDir":"www","server":{"cleartext":true}}
          EOF
          npx cap add android

          # 1. ऐप का नाम हिंदी 'स्पर्श साथी' सेट करना
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">स्पर्श साथी<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">स्पर्श साथी<\/string>/' android/app/src/main/res/values/strings.xml

          # 2. नीले घेरे वाला 'स' लोगो तैयार करना
          python3 - << 'EOF'
          from PIL import Image, ImageDraw, ImageFont
          import os
          sizes = [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]
          for f, s in sizes:
              im = Image.new('RGBA', (s, s), (255, 255, 255, 255))
              d = ImageDraw.Draw(im)
              bw = max(3, s // 11)
              d.ellipse([bw, bw, s - bw, s - bw], outline=(26, 115, 232), width=bw)
              try: font = ImageFont.truetype('/tmp/hindi.ttf', int(s * 0.52))
              except: font = ImageFont.load_default()
              bb = d.textbbox((0, 0), "स", font=font)
              d.text(((s - (bb[2]-bb[0]))/2 - bb[0], (s - (bb[3]-bb[1]))/2 - bb[1]), "स", fill=(13, 71, 161), font=font)
              p = f"android/app/src/main/res/{f}"
              os.makedirs(p, exist_ok=True)
              im.save(f"{p}/ic_launcher.png")
              im.save(f"{p}/ic_launcher_round.png")
              im.save(f"{p}/ic_launcher_foreground.png")
          EOF

          # 3. पुराने डिफ़ॉल्ट आइकॉन हटाना
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # 4. परमिशन जोड़ना
          sed -i '/<application/i <uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.FLASHLIGHT" />\n<uses-feature android:name="android.hardware.camera" android:required="false" />\n<uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml
          
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Direct APK Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.$GITHUB_RUN_NUMBER" app-build/android/app/build/outputs/apk/debug/app-debug.apk --title "स्पर्श साथी APK v1.0.$GITHUB_RUN_NUMBER" --notes "सीधा नया APK डाउनलोड करें" || true

      - name: Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sparsh-Saathi-APK
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk
          
