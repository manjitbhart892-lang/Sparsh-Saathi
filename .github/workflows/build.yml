name: Build Sparsh Hand Cricket APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Create Game App
        run: |
          mkdir -p app-build/www
          cat << 'EOF' > app-build/www/index.html
          <!DOCTYPE html>
          <html lang="hi">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
          <title>स्पर्श हैंड क्रिकेट</title>
          <style>
          *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;}
          :root{--bg:#121212;--card:#1e1e1e;--pri:#ffcc00;--txt:#ffffff;--red:#e53935;--grn:#43a047;}
          body{background:var(--bg);color:var(--txt);padding:14px;min-height:100vh;}
          header{text-align:center;padding:14px;background:var(--card);border-radius:18px;border:2px solid var(--pri);margin-bottom:12px;}
          .sub-title{font-size:12px;opacity:0.9;margin-top:4px;}
          .pill-btn{background:rgba(255,204,0,0.15);color:var(--pri);border:1px solid var(--pri);padding:7px 14px;border-radius:10px;font-weight:bold;cursor:pointer;}
          #scoreCard{background:#000;border:3px solid var(--pri);border-radius:16px;padding:16px;text-align:center;margin-bottom:14px;}
          .runs-txt{font-size:32px;font-weight:900;color:var(--pri);margin:4px 0;}
          .info-txt{font-size:15px;opacity:0.9;}
          .mode-row{display:flex;gap:10px;margin-bottom:12px;}
          .mode-btn{flex:1;padding:12px;border-radius:12px;border:2px solid #555;background:var(--card);color:#fff;font-weight:bold;font-size:14px;cursor:pointer;}
          .mode-active{background:var(--pri)!important;color:#000!important;border-color:#fff!important;}
          .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
          .run-btn{background:var(--card);color:#fff;border:3px solid #444;border-radius:16px;padding:24px 0;font-size:32px;font-weight:900;cursor:pointer;}
          .run-btn:active{transform:scale(0.95);background:var(--pri);color:#000;}
          .big-btn{display:block;width:100%;padding:14px;border-radius:12px;font-size:16px;font-weight:bold;border:none;cursor:pointer;margin-top:10px;text-decoration:none;text-align:center;color:#fff;}
          #profModal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.85);z-index:99999;padding:20px;}
          .p-card{background:var(--card);border:2px solid var(--pri);border-radius:20px;padding:20px;margin-top:12%;text-align:center;}
          </style>
          </head>
          <body>
          <header>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <h1 style="font-size:22px;color:var(--pri);">🏏 स्पर्श हैंड क्रिकेट</h1>
          <button class="pill-btn" onclick="openProfile()">⋮ मंजीत प्रोफ़ाइल</button>
          </div>
          <div class="sub-title">स्पर्श राजकीय दृष्टिबाधित बालक इंटर कॉलेज, लालडिग्गी, गोरखपुर</div>
          </header>

          <div class="mode-row">
          <button class="mode-btn mode-active" id="mVsAi" onclick="setMode('ai')">🤖 कंप्यूटर मोड</button>
          <button class="mode-btn" id="mVs2P" onclick="setMode('2p')">👥 दोस्त के साथ (2-Player)</button>
          </div>

          <div id="scoreCard" role="region" aria-live="polite">
          <div class="info-txt" id="gameStatus">मैच शुरू करें - कोई भी रन चुनें</div>
          <div class="runs-txt" id="scoreDisp">स्कोर: 0 / 0</div>
          <div class="info-txt" id="turnDisp">आपकी बैटिंग चल रही है</div>
          </div>

          <div style="text-align:center;font-size:15px;font-weight:bold;margin-bottom:8px;color:var(--pri);" id="actionPrompt">अपना रन नंबर दबाएं (1 से 6):</div>

          <div class="grid">
          <button class="run-btn" onclick="playTurn(1)">1</button>
          <button class="run-btn" onclick="playTurn(2)">2</button>
          <button class="run-btn" onclick="playTurn(3)">3</button>
          <button class="run-btn" onclick="playTurn(4)">4</button>
          <button class="run-btn" onclick="playTurn(5)">5</button>
          <button class="run-btn" onclick="playTurn(6)">6</button>
          </div>

          <button class="big-btn" style="background:#444;" onclick="resetGame()">🔄 नया मैच शुरू करें</button>

          <div id="profModal">
          <div class="p-card">
          <div style="width:60px;height:60px;border-radius:50%;background:var(--pri);color:#000;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;margin-bottom:10px;">मं</div>
          <h2 style="font-size:20px;">मंजीत भारती</h2>
          <p style="color:var(--pri);font-weight:bold;margin-top:2px;">गेम निर्माता एवं डेवलपर</p>
          <p style="font-size:13px;margin:8px 0;">स्पर्श राजकीय दृष्टिबाधित बालक इंटर कॉलेज, लालडिग्गी, गोरखपुर</p>
          <a href="tel:9682970623" class="big-btn" style="background:var(--grn);">📞 डेवलपर को फ़ोन करें (9682970623)</a>
          <a href="mailto:manjitbharti892@gmail.com?subject=Sparsh%20Hand%20Cricket%20Feedback" class="big-btn" style="background:#1e88e5;">✉️ फ़ीडबैक ईमेल भेजें</a>
          <button class="big-btn" style="background:var(--red);" onclick="closeProfile()">बंद करें</button>
          </div>
          </div>

          <script>
          let mode = 'ai';
          let p1Score = 0, p2Score = 0;
          let currentInnings = 1;
          let target = 0;
          let p1Pick = 0;
          let audioCtx = null;

          function speak(txt) {
            if ('speechSynthesis' in window) {
              try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'hi-IN';
                u.rate = 1.0;
                window.speechSynthesis.speak(u);
              } catch(e){}
            }
          }

          function tone(f, dur) {
            try {
              if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
              const o = audioCtx.createOscillator();
              const g = audioCtx.createGain();
              o.frequency.value = f;
              o.connect(g);
              g.connect(audioCtx.destination);
              o.start();
              o.stop(audioCtx.currentTime + dur);
            } catch(e){}
          }

          function setMode(m) {
            mode = m;
            document.getElementById('mVsAi').className = 'mode-btn ' + (m === 'ai' ? 'mode-active' : '');
            document.getElementById('mVs2P').className = 'mode-btn ' + (m === '2p' ? 'mode-active' : '');
            resetGame();
            speak(m === 'ai' ? "कंप्यूटर मोड चुना गया। आपकी बैटिंग है।" : "दो खिलाड़ी मोड चुना गया। खिलाड़ी 1 की बैटिंग है।");
          }

          function playTurn(val) {
            if (mode === 'ai') {
              playVsAi(val);
            } else {
              playVs2P(val);
            }
          }

          function playVsAi(userVal) {
            const aiVal = Math.floor(Math.random() * 6) + 1;
            if (currentInnings === 1) {
              if (userVal === aiVal) {
                tone(220, 0.4);
                if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
                target = p1Score + 1;
                currentInnings = 2;
                document.getElementById('gameStatus').innerText = "अरे आप आउट हो गए!";
                document.getElementById('turnDisp').innerText = "कंप्यूटर की बैटिंग। लक्ष्य: " + target;
                speak("अरे आप आउट हो गए! दोनों ने चुना " + userVal + "। आपका कुल स्कोर है " + p1Score + "। अब कंप्यूटर को जीतने के लिए चाहिए " + target + " रन।");
              } else {
                p1Score += userVal;
                tone(580, 0.15);
                if ('vibrate' in navigator) navigator.vibrate(40);
                document.getElementById('scoreDisp').innerText = "स्कोर: " + p1Score + " रन";
                document.getElementById('gameStatus').innerText = "आपने " + userVal + " चुना, कंप्यूटर ने " + aiVal;
                speak(userVal + " रन! कुल स्कोर " + p1Score);
              }
            } else {
              if (userVal === aiVal) {
                tone(750, 0.4);
                if ('vibrate' in navigator) navigator.vibrate([100, 50, 100, 50, 200]);
                document.getElementById('gameStatus').innerText = "विकेट! कंप्यूटर आउट हो गया!";
                if (p2Score < target - 1) {
                  speak("विकेट! कंप्यूटर आउट हो गया! बधाई हो, आप " + (target - 1 - p2Score) + " रन से मैच जीत गए!");
                } else if (p2Score === target - 1) {
                  speak("मैच टाई हो गया! दोनों का स्कोर बराबर रहा!");
                }
                setTimeout(resetGame, 4000);
              } else {
                p2Score += aiVal;
                tone(420, 0.15);
                document.getElementById('scoreDisp').innerText = "कंप्यूटर स्कोर: " + p2Score + " / लक्ष्य: " + target;
                if (p2Score >= target) {
                  speak("कंप्यूटर ने " + aiVal + " रन बनाए और मैच जीत लिया। बेहतर खेल अगली बार!");
                  setTimeout(resetGame, 4000);
                } else {
                  speak("कंप्यूटर ने बनाए " + aiVal + " रन। कंप्यूटर को चाहिए " + (target - p2Score) + " रन।");
                }
              }
            }
          }

          function playVs2P(val) {
            if (p1Pick === 0) {
              p1Pick = val;
              document.getElementById('actionPrompt').innerText = "अब खिलाड़ी 2 (बॉलर) अपना नंबर दबाएं:";
              speak("खिलाड़ी 1 ने चुन लिया। अब खिलाड़ी 2 अपना नंबर दबाएं।");
            } else {
              const p2Pick = val;
              if (currentInnings === 1) {
                if (p1Pick === p2Pick) {
                  tone(220, 0.4);
                  if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
                  target = p1Score + 1;
                  currentInnings = 2;
                  document.getElementById('gameStatus').innerText = "विकेट! खिलाड़ी 1 आउट!";
                  document.getElementById('turnDisp').innerText = "खिलाड़ी 2 की बैटिंग। लक्ष्य: " + target;
                  speak("विकेट! दोनों ने चुना " + p1Pick + "। खिलाड़ी 1 आउट! कुल स्कोर " + p1Score + "। अब खिलाड़ी 2 को जीतने के लिए चाहिए " + target + " रन।");
                } else {
                  p1Score += p1Pick;
                  tone(580, 0.15);
                  document.getElementById('scoreDisp').innerText = "खिलाड़ी 1: " + p1Score + " रन";
                  document.getElementById('gameStatus').innerText = "रन बने: " + p1Pick;
                  speak(p1Pick + " रन! खिलाड़ी 1 का स्कोर " + p1Score);
                }
              } else {
                if (p1Pick === p2Pick) {
                  tone(750, 0.4);
                  if ('vibrate' in navigator) navigator.vibrate([100, 50, 200]);
                  if (p2Score < target - 1) {
                    speak("विकेट! खिलाड़ी 2 आउट! बधाई हो खिलाड़ी 1 मैच जीत गया!");
                  } else {
                    speak("मैच टाई हो गया!");
                  }
                  setTimeout(resetGame, 4000);
                } else {
                  p2Score += p1Pick;
                  tone(580, 0.15);
                  document.getElementById('scoreDisp').innerText = "खिलाड़ी 2: " + p2Score + " / लक्ष्य: " + target;
                  if (p2Score >= target) {
                    speak("खिलाड़ी 2 ने लक्ष्य पार कर लिया और मैच जीत गया! बधाई हो!");
                    setTimeout(resetGame, 4000);
                  } else {
                    speak(p1Pick + " रन! चाहिए " + (target - p2Score) + " रन।");
                  }
                }
              }
              p1Pick = 0;
              document.getElementById('actionPrompt').innerText = "खिलाड़ी 1 (बैट्समैन) अपना नंबर दबाएं (1 से 6):";
            }
          }

          function resetGame() {
            p1Score = 0; p2Score = 0;
            currentInnings = 1;
            target = 0;
            p1Pick = 0;
            document.getElementById('scoreDisp').innerText = "स्कोर: 0 रन";
            document.getElementById('gameStatus').innerText = "नया मैच शुरू! पहली इनिंग्स";
            document.getElementById('turnDisp').innerText = (mode === 'ai') ? "आपकी बैटिंग चल रही है" : "खिलाड़ी 1 की बैटिंग";
            document.getElementById('actionPrompt').innerText = "अपना रन नंबर दबाएं (1 से 6):";
          }

          function openProfile() { document.getElementById('profModal').style.display = 'block'; }
          function closeProfile() { document.getElementById('profModal').style.display = 'none'; }

          window.onload = function() {
            speak("स्पर्श हैंड क्रिकेट में आपका स्वागत है। मैच शुरू करने के लिए कोई भी रन दबाएं।");
          };
          </script>
          </body>
          </html>
          EOF

      - name: Build Android APK
        run: |
          cd app-build
          npm init -y
          npm i @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          cat << 'EOF' > capacitor.config.json
          {"appId":"com.sparsh.handcricket","appName":"स्पर्श हैंड क्रिकेट","webDir":"www","server":{"cleartext":true}}
          EOF
          npx cap add android

          # ऐप का नाम सेट करना
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">स्पर्श हैंड क्रिकेट<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">स्पर्श हैंड क्रिकेट<\/string>/' android/app/src/main/res/values/strings.xml

          # कंपन परमिशन जोड़ना
          sed -i '/<application/i <uses-permission android:name="android.permission.VIBRATE" />' android/app/src/main/AndroidManifest.xml

          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sparsh-Hand-Cricket.apk

      - name: Direct APK Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v3.0.$GITHUB_RUN_NUMBER" app-build/Sparsh-Hand-Cricket.apk \
            --title "स्पर्श हैंड क्रिकेट APK v3.0.$GITHUB_RUN_NUMBER" \
            --notes "सीधा स्पर्श हैंड क्रिकेट गेम APK डाउनलोड करें (मंजीत भारती - 9682970623)"
            
