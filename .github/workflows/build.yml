name: Build Sparsh Saathi APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Web-to-APK Project
        run: |
          mkdir -p app-build/www
          cd app-build
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Sparsh Saathi</title></head><body>Loading Sparsh Saathi...</body></html>' > www/index.html
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sparsh.saathi",
            "appName": "Sparsh Saathi",
            "webDir": "www",
            "server": {
              "url": "https://sparsh-saathi.ai.studio",
              "cleartext": true
            }
          }
          EOF
          
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sparsh-Saathi-APK
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk
          
