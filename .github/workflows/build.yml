name: Build Sparsh Saathi APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Python, Pillow & Hindi Font
        run: |
          pip install pillow --break-system-packages
          curl -fsSL "https://github.com/googlefonts/noto-fonts/raw/main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Bold.ttf" -o /tmp/hindi_font.ttf

      - name: Create Web Project & Auto-Generate 4-Color 'स' Logo
        run: |
          mkdir -p app-build/www
          
          # सभी वेब फाइलों को www फोल्डर में कॉपी करना
          rsync -av --exclude='app-build' --exclude='.github' --exclude='.git' ./ app-build/www/
          
          cd app-build
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          # Capacitor कॉन्फ़िगरेशन
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.sparsh.saathi",
            "appName": "स्पर्श साथी",
            "webDir": "www",
            "server": {
              "cleartext": true
            }
          }
          EOF
          
          npx cap add android

          # गूगल के 4 रंगों वाला 'स' ऐप आइकन तैयार करना
          python3 - << 'EOF'
          from PIL import Image, ImageDraw, ImageFont
          import os

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          font_path = "/tmp/hindi_font.ttf"

          for folder, sz in sizes.items():
              img = Image.new('RGBA', (sz, sz), (255, 255, 255, 255))
              draw = ImageDraw.Draw(img)
              
              # गूगल के 4 रंग (बॉर्डर रिंग)
              b = max(2, sz // 14)
              draw.arc([b, b, sz - b, sz - b], start=180, end=270, fill=(66, 133, 244), width=b)  # Blue
              draw.arc([b, b, sz - b, sz - b], start=270, end=360, fill=(234, 67, 53), width=b)   # Red
              draw.arc([b, b, sz - b, sz - b], start=0, end=90, fill=(251, 188, 5), width=b)     # Yellow
              draw.arc([b, b, sz - b, sz - b], start=90, end=180, fill=(52, 168, 83), width=b)    # Green
              
              # देवनागरी 'स'
              try:
                  font = ImageFont.truetype(font_path, int(sz * 0.52))
              except:
                  font = ImageFont.load_default()
              
              text = "स"
              bbox = draw.textbbox((0, 0), text, font=font)
              w = bbox[2] - bbox[0]
              h = bbox[3] - bbox[1]
              x = (sz - w) / 2 - bbox[0]
              y = (sz - h) / 2 - bbox[1]
              draw.text((x, y), text, fill=(32, 33, 36), font=font)
              
              out_dir = f"android/app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              img.save(f"{out_dir}/ic_launcher.png")
              img.save(f"{out_dir}/ic_launcher_round.png")
              img.save(f"{out_dir}/ic_launcher_foreground.png")
          print("लोगो सफलतापूर्वक तैयार हो गया!")
          EOF

          # पुराने डिफॉल्ट लोगो को हटाना ताकि नया 'स' लोगो ही दिखे
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

          # परमिशन जोड़ना
          sed -i '/<application/i <uses-permission android:name="android.permission.VIBRATE" />\n<uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd app-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Sparsh Saathi APK
        uses: actions/upload-artifact@v4
        with:
          name: Sparsh-Saathi-Finished-APK
          path: app-build/android/app/build/outputs/apk/debug/app-debug.apk
          
